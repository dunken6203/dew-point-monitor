<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="13">
  <rect width="760" height="280" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8f98"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f2328">感測資料經 ESP32-S3 計算後以 MQTT 上傳雲端</text>
  <g fill="none" stroke="#8a8f98" stroke-width="1.25">
    <path d="M194 110H254" marker-end="url(#a)"/>
    <path d="M194 210H254" marker-end="url(#a)"/>
    <path d="M464 110H544" marker-end="url(#a)"/>
    <path d="M640 150V190" marker-end="url(#a)"/>
  </g>
  <rect x="24" y="70" width="170" height="80" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="109" y="104" text-anchor="middle" font-weight="600" fill="#1f2328">感測器 A（DHT11）</text>
  <text x="109" y="126" text-anchor="middle" font-size="11.5" fill="#57606a">監測點：電控箱內</text>
  <rect x="24" y="170" width="170" height="80" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="109" y="204" text-anchor="middle" font-weight="600" fill="#1f2328">感測器 B（DHT11）</text>
  <text x="109" y="226" text-anchor="middle" font-size="11.5" fill="#57606a">參考點：環境</text>
  <rect x="254" y="70" width="210" height="180" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"/>
  <text x="359" y="98" text-anchor="middle" font-weight="600" fill="#1f2328">ESP32-S3</text>
  <text x="274" y="126" font-size="11.5" fill="#1f2328">1. 讀取並校正溫濕度</text>
  <text x="274" y="150" font-size="11.5" fill="#1f2328">2. 計算露點、絕對濕度</text>
  <text x="274" y="174" font-size="11.5" fill="#1f2328">3. 判斷結露預警</text>
  <text x="274" y="198" font-size="11.5" fill="#1f2328">4. 偵測感測器故障</text>
  <text x="274" y="222" font-size="11.5" fill="#1f2328">5. 組成 MQTT payload</text>
  <rect x="544" y="70" width="192" height="80" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="640" y="98" text-anchor="middle" font-weight="600" fill="#1f2328">ThingSpeak 雲端</text>
  <text x="640" y="120" text-anchor="middle" font-size="11.5" fill="#57606a">MQTT Broker</text>
  <text x="640" y="138" text-anchor="middle" font-size="11.5" fill="#57606a">8 個欄位儲存資料</text>
  <rect x="544" y="190" width="192" height="60" rx="8" fill="none" stroke="#8a8f98" stroke-width="1.25"/>
  <text x="640" y="214" text-anchor="middle" font-weight="600" fill="#1f2328">MATLAB 視覺化</text>
  <text x="640" y="236" text-anchor="middle" font-size="11.5" fill="#57606a">溫度・露點・預警線</text>
  <text x="224" y="102" text-anchor="middle" font-size="11.5" fill="#57606a">GPIO 4</text>
  <text x="224" y="202" text-anchor="middle" font-size="11.5" fill="#57606a">GPIO 17</text>
  <text x="504" y="102" text-anchor="middle" font-size="11.5" fill="#57606a">Wi-Fi・MQTT</text>
  <text x="504" y="128" text-anchor="middle" font-size="11.5" fill="#57606a">每 20 秒</text>
  <text x="652" y="174" font-size="11.5" fill="#57606a">讀取欄位</text>
</svg>
